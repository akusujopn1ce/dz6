<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Greenshop - Реєстрація</title> 
</head>
<body class="register-page"> 

    <div class="form-container">
        
        <div class="form-header">
            <div class="logo-container">
                <img src="images/logo.png" alt="logo" style="height: 35px;"> 
            </div>
            
            <nav class="auth-nav">
                <button type="button" class="btn-link">Login</button>
                <span class="divider">|</span>
                <button type="button" class="btn-link btn-link--active">Register</button>
            </nav>
        </div>

        <form action="index.html" class="register-form">
            
            <div class="form-group">
                <label for="username">Зробіть ваш Username:</label>
                <input type="text" id="username" class="input-field" placeholder="vasyapupkin666" required>
            </div>

            <div class="form-group">
                <label for="email">Введіть ваш Email:</label>
                <input type="email" id="email" class="input-field" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Зробіть пароль:</label>
                <input type="password" id="password" class="input-field">
            </div>

            <div class="form-group">
                <label for="confirm_password">Підтвердіть пароль:</label>
                <input type="password" id="confirm_password" class="input-field">
            </div>

            <button type="submit" class="btn btn-main">Зареєструватись</button>
        </form>

        <div class="social-login">
             <p class="social-text">Або зареєструйтесь через</p>
             <button type="button" class="btn btn-google">
                 <img src="images/google.svg" alt="google-icon">
                 Продовжити з Google
             </button>
        </div>

    </div>

</body>
</html>
