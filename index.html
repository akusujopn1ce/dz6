<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenshop - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body> 
    
    <div class="container">
        
        <header class="main-header">
            <div class="logo-col">
                <img src="images/logo.png" alt="logo-icon">
            </div>
            
            <nav class="nav-col">
                <ul class="nav-list">
                    <li class="nav-item active"><a href="#">Home</a></li>
                    <li class="nav-item"><a href="#">Shop</a></li>
                    <li class="nav-item"><a href="#">Plant Care</a></li>
                    <li class="nav-item"><a href="#">Blogs</a></li>
                </ul>
            </nav>
            
            <div class="actions-col">
                <a href="#" class="icon-link">🔍</a> 
                <a href="#" class="icon-link">🛒</a> 
                <a href="register.html" class="btn-login">Register</a> 
            </div>
        </header>

        <section class="hero-section">
            <div class="hero-text-box">
                <p class="sub-title">WELCOME TO GREENSHOP</p>
                <h1 class="main-title">LET'S MAKE A <br> BETTER <span class="highlight">PLANET</span></h1>
                <p class="description">
                    We are an online plant shop offering a wide range of cheap and trendy plants. 
                    Use our plants to create an unique Urban Jungle. Order your favorite plants!
                </p>
                <button class="btn-primary">SHOP NOW</button>
            </div>
            
            <div class="hero-image-box">
                <img src="images/big-plant.png" alt="big-plant" class="hero-img-big">
                <img src="images/small-plant.png" alt="small-plant" class="hero-img-small">
            </div>
        </section>

    </div>

</body>
</html>
